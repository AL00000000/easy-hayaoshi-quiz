<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出題SEの候補 - 簡単早押しクイズ</title>
<style>
  body { font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #f3f5f9; color: #222; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #666; font-size: 14px; margin: 0 0 18px; }
  .list { display: grid; gap: 10px; max-width: 560px; }
  button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; font-size: 16px; padding: 14px 16px; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); cursor: pointer; }
  button:hover { background: #eef2fb; }
  .no { font-weight: bold; color: #263a5c; min-width: 2.2em; }
  .desc { color: #777; font-size: 13px; display: block; }
</style>
</head>
<body>
<h1>出題のときの効果音（候補）</h1>
<p>押すと鳴ります。気に入った番号を教えてください（いま使っているのは 3）。10〜19はデデン系を作り直した新しい候補です。</p>
<div class="list" id="list"></div>
<script>
let ctx = null;
const ac = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; };
function tone(freq, start, dur, { type = "sine", vol = 0.25, attack = 0.005, filter = null, to = null } = {}) {
  const c = ac(), t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let n = o; if (filter) { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filter; o.connect(f); n = f; }
  n.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(start, dur, { vol = 0.2, hp = 1000, lp = 12000, attack = 0.005 } = {}) {
  const c = ac(), t = c.currentTime + start, len = Math.ceil(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), h = c.createBiquadFilter(), l = c.createBiquadFilter(), g = c.createGain();
  s.buffer = b; h.type = "highpass"; h.frequency.value = hp; l.type = "lowpass"; l.frequency.value = lp;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(h); h.connect(l); l.connect(g); g.connect(c.destination); s.start(t); s.stop(t + dur);
}
const bell = (f, st, dur = 1.2, vol = 0.18) => { tone(f, st, dur, { vol }); tone(f * 2.76, st, dur * 0.5, { vol: vol * 0.35 }); tone(f * 5.4, st, dur * 0.25, { vol: vol * 0.15 }); };
const CANDS = [
  ["デデン（いまの音）", "低いのこぎり波の2連打", () => { for (const [f, st, d] of [[196, 0, 0.16], [131, 0.2, 0.7]]) { tone(f, st, d, { type: "sawtooth", vol: 0.22, filter: 1400 }); tone(f / 2, st, d, { type: "square", vol: 0.12, filter: 600 }); } }],
  ["重いデデン", "低音を厚くし、2打目に打撃音を足したもの", () => { for (const [f, st, d] of [[110, 0, 0.18], [82.4, 0.22, 0.9]]) { tone(f, st, d, { type: "sawtooth", vol: 0.25, filter: 900 }); tone(f * 1.5, st, d, { type: "sawtooth", vol: 0.1, filter: 900 }); tone(f / 2, st, d, { type: "sine", vol: 0.35 }); noise(st, 0.12, { vol: 0.12, hp: 200, lp: 2000 }); } }],
  ["ジャン！", "和音を一発、シンバル付き", () => { for (const f of [261.6, 329.6, 392, 523.3]) tone(f, 0, 0.8, { type: "sawtooth", vol: 0.09, filter: 3000 }); tone(130.8, 0, 0.8, { type: "square", vol: 0.12, filter: 800 }); noise(0, 0.9, { vol: 0.12, hp: 5000 }); }],
  ["タタターン", "短い3音のファンファーレ", () => { [[523.3, 0, 0.11], [659.3, 0.13, 0.11], [784, 0.26, 0.6]].forEach(([f, st, d]) => { tone(f, st, d, { type: "square", vol: 0.12, filter: 4000 }); tone(f / 2, st, d, { type: "triangle", vol: 0.15 }); }); }],
  ["ポローン", "鐘のような2音（上がる）", () => { bell(659.3, 0); bell(987.8, 0.18, 1.4); }],
  ["ドゥルルル…ジャン", "短いドラムロールからシンバル", () => { for (let i = 0; i < 14; i++) noise(i * 0.04, 0.05, { vol: 0.08 + i * 0.008, hp: 300, lp: 3000 }); noise(0.58, 1.0, { vol: 0.22, hp: 4000 }); tone(98, 0.58, 0.5, { type: "sine", vol: 0.35 }); }],
  ["ヒュイン", "下から上へ伸びる音", () => { tone(280, 0, 0.35, { type: "sawtooth", vol: 0.12, filter: 2500, to: 1400 }); tone(1400, 0.35, 0.35, { type: "sine", vol: 0.15 }); }],
  ["ピコン", "短く軽いチャイム", () => { tone(1318.5, 0, 0.12, { type: "square", vol: 0.08, filter: 5000 }); tone(1760, 0.08, 0.35, { type: "sine", vol: 0.18 }); }],
  ["ドン・ドン・ジャーン", "太鼓2つと和音", () => { [0, 0.18].forEach((st) => { tone(70, st, 0.25, { type: "sine", vol: 0.45, to: 45 }); noise(st, 0.06, { vol: 0.1, hp: 100, lp: 1500 }); }); for (const f of [220, 277.2, 329.6]) tone(f, 0.4, 0.9, { type: "sawtooth", vol: 0.08, filter: 2000 }); noise(0.4, 0.8, { vol: 0.08, hp: 5000 }); }],
];

// ===== デデン系の新しい音作り（ブラス・ティンパニ・残響を重ねる） =====
let bus = null, rev = null;
function master() {
  const c = ac();
  if (bus) return { c, bus, rev };
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(c.destination);
  bus = c.createGain(); bus.gain.value = 0.9; bus.connect(comp);
  // 残響：減衰するノイズのインパルス応答
  const len = c.sampleRate * 1.6, ir = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  rev = c.createConvolver(); rev.buffer = ir; const rg = c.createGain(); rg.gain.value = 0.35; rev.connect(rg); rg.connect(comp);
  return { c, bus, rev };
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
function out(node, wet = 0.4) { const { bus, rev } = master(); node.connect(bus); const s = master().c.createGain(); s.gain.value = wet; node.connect(s); s.connect(rev); }
// ブラス：ずらした鋸歯状波を重ね、フィルターを一瞬で開いて閉じる
function brass(notes, st, dur, { vol = 0.12, bright = 3500, wet = 0.4, detune = 8 } = {}) {
  const { c } = master(), t = c.currentTime + st, f = c.createBiquadFilter(), g = c.createGain();
  f.type = "lowpass"; f.Q.value = 2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(bright, t + 0.03); f.frequency.exponentialRampToValueAtTime(bright * 0.35, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.setTargetAtTime(vol * 0.6, t + 0.06, 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  f.connect(g); out(g, wet);
  for (const m of notes) for (const d of [-detune, 0, detune]) { const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m); o.detune.value = d; o.connect(f); o.start(t); o.stop(t + dur + 0.1); }
}
// ティンパニ：音程が少し下がる正弦波＋打撃のノイズ
function timp(m, st, dur = 0.9, vol = 0.5, wet = 0.3) {
  const { c } = master(), t = c.currentTime + st, o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(mtof(m) * 1.08, t); o.frequency.exponentialRampToValueAtTime(mtof(m), t + 0.08);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); out(g, wet); o.start(t); o.stop(t + dur + 0.05);
  hit(st, 0.08, vol * 0.25, 120, 1800, wet);
}
function hit(st, dur, vol, hp, lp, wet = 0.3) {
  const { c } = master(), t = c.currentTime + st, len = Math.ceil(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), h = c.createBiquadFilter(), l = c.createBiquadFilter(), g = c.createGain();
  s.buffer = b; h.type = "highpass"; h.frequency.value = hp; l.type = "lowpass"; l.frequency.value = lp;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(h); h.connect(l); l.connect(g); out(g, wet); s.start(t); s.stop(t + dur);
}
const crash = (st, dur = 1.6, vol = 0.12) => hit(st, dur, vol, 4500, 14000, 0.5);
// オーケストラヒット：ブラス＋低音＋ティンパニ＋打撃
function orch(chord, bassM, st, dur, o = {}) { brass(chord, st, dur, o); brass([bassM, bassM + 12], st, dur, { ...o, vol: (o.vol || 0.12) * 0.9, bright: 1500 }); timp(bassM, st, dur + 0.3, o.timp ?? 0.5); hit(st, 0.05, 0.12, 800, 6000); }
// 和音（MIDI番号）：C4=60
const Cm = [60, 63, 67], C = [60, 64, 67], G = [55, 59, 62], Gm = [55, 58, 62], Fsdim = [54, 57, 60];
CANDS.push(
  ["オーケストラ・デデン（下がる）", "ブラスとティンパニの2連打。1打目G→2打目C、残響あり", () => { orch(G, 43, 0, 0.16); orch(C, 36, 0.21, 0.9); }],
  ["ブラス・デデン（同じ高さ）", "短調の和音を同じ高さで2回。2打目を長く", () => { orch(Cm, 36, 0, 0.14); orch(Cm, 36, 0.19, 1.0); }],
  ["重低音デデン", "低いブラスと大きいティンパニ。圧の強い音", () => { orch([48, 51, 55], 24, 0, 0.18, { bright: 1800, vol: 0.14, timp: 0.7 }); orch([43, 46, 50], 19, 0.23, 1.1, { bright: 1600, vol: 0.15, timp: 0.8 }); }],
  ["緊張感デデン", "不協和な和音で始まり、短調に落ちる", () => { orch(Fsdim, 42, 0, 0.15); orch(Cm, 36, 0.2, 1.0); }],
  ["速いデデン", "間を詰めた歯切れのよい2連打", () => { orch(Gm, 43, 0, 0.09, { bright: 4500 }); orch(Cm, 36, 0.12, 0.75, { bright: 4500 }); }],
  ["デデン＋シンバル", "2打目でシンバルが広がる派手な版", () => { orch(G, 43, 0, 0.16); orch(C, 36, 0.21, 1.0); crash(0.21, 2.0, 0.14); }],
  ["シンセ・デデン", "電子的な音色。フィルターが開く音", () => { brass([55, 62, 67], 0, 0.15, { vol: 0.1, bright: 6000, wet: 0.25, detune: 18 }); brass([48, 55, 60], 0.2, 0.8, { vol: 0.11, bright: 6000, wet: 0.25, detune: 18 }); hit(0, 0.05, 0.1, 2000, 9000); hit(0.2, 0.05, 0.1, 2000, 9000); }],
  ["ドドン（ティンパニだけ）", "打楽器だけの低い2連打", () => { timp(43, 0, 0.5, 0.7); timp(36, 0.2, 1.3, 0.8); }],
  ["デデンッ（上がる）", "2打目が上がって明るく終わる", () => { orch(C, 36, 0, 0.15); orch([65, 69, 72], 41, 0.2, 0.9); }],
  ["ピアノ低音デデン", "ピアノの低い和音をたたく感じ", () => { const pn = (ms, st, d) => ms.forEach((m) => { tone(mtof(m), st, d, { type: "triangle", vol: 0.12 }); tone(mtof(m) * 2, st, d * 0.6, { type: "sine", vol: 0.05 }); }); pn([31, 43, 50, 55], 0, 0.5); pn([24, 36, 43, 48, 51], 0.2, 1.6); }],
);
const list = document.getElementById("list");
CANDS.forEach(([name, desc, fn], i) => {
  if (i === 9) { const h = document.createElement("h2"); h.textContent = "デデン系の新しい候補（10〜19）"; h.style.cssText = "font-size:17px;margin:18px 0 2px"; list.appendChild(h); }
  const b = document.createElement("button");
  b.innerHTML = `<span class="no">${i + 1}</span><span>${name}<span class="desc">${desc}</span></span>`;
  b.onclick = () => { ac(); fn(); };
  list.appendChild(b);
});
</script>
</body>
</html>
